[project]
name = "riftoracle"
version = "0.1.0"
description = "LoL esports match prediction engine"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
